name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    # The app itself is not built in this job (see `apps`): hosted runners trail
    # new Xcode releases, and an archive brings in signing. This covers what can
    # break without a TV.
    # No paths filter: `core` is a required check, and a filtered-out run never
    # reports, which would leave a docs-only PR unmergeable.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version that generated the committed project; a different
      # XcodeGen can write a different project and fail the sync check spuriously.
      - name: Install XcodeGen 2.46.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Xcode project matches project.yml
        run: Tools/check_project_sync.sh

      - uses: actions/cache@v4
        with:
          path: Packages/DashboardCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/DashboardCore/Package.swift', 'Packages/DashboardCore/Sources/**', 'Packages/DashboardCore/Tests/**') }}
          restore-keys: spm-${{ runner.os }}-

      - name: DashboardCore tests
        working-directory: Packages/DashboardCore
        run: swift test

  apps:
    # What ships: the tvOS app and the Mac screensaver, which compiles the app's
    # layouts for macOS too, so a view change can break it without touching
    # DashboardCore. Plain unsigned builds, not archives, so signing never comes
    # into it. Not a required check: if the runner's Xcode trails a feature the
    # project uses, this fails in plain sight without blocking a merge.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Build the tvOS app and the screensaver
        run: |
          set +e
          status=0
          for target in "HomeDashboard|generic/platform=tvOS Simulator" "HomeDashboardSaver|generic/platform=macOS"; do
            scheme="${target%%|*}"
            xcodebuild build -project HomeDashboardTV.xcodeproj -scheme "$scheme" \
              -destination "${target#*|}" -derivedDataPath build/ci CODE_SIGNING_ALLOWED=NO \
              > "$scheme.log" 2>&1 || status=1
            echo "$scheme: $(grep -E 'BUILD (SUCCEEDED|FAILED)' "$scheme.log")"
            grep -E 'error:' "$scheme.log" | head -20
          done
          exit $status
