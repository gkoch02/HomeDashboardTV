name: HomeDashboardTV
options:
  bundleIdPrefix: dev.plumpbug
  deploymentTarget:
    tvOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: "27.0"
# The team and bundle prefix come from Config/Signing.xcconfig, which a builder overrides
# with their own in Config/Signing.local.xcconfig (ignored by git). Settings here would
# take precedence over it, so neither is set below.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    # Automatic profiles, for whichever team Signing.xcconfig names.
    CODE_SIGN_STYLE: Automatic
    # Xcode 27's recommended settings live here, not in the .pbxproj, because an edit
    # made in Xcode's UI is wiped by the next `xcodegen`.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
packages:
  DashboardCore:
    path: Packages/DashboardCore
targets:
  HomeDashboard:
    type: application
    platform: tvOS
    productName: Home Dashboard
    sources:
      - path: HomeDashboardTV
        excludes:
          - "Info.plist"
          - "Resources/Fonts/*.txt"
    dependencies:
      - package: DashboardCore
    # Generated by XcodeGen and committed, like the project, so a fresh clone builds.
    info:
      path: HomeDashboardTV/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: LaunchBackground
        # The moonphase, halftone, wide_horizon, light_cycle, qotd and wide_night themes'
        # faces, from HomeDashboard's fonts/ (all OFL; licences beside them).
        UIAppFonts:
          - Cinzel.ttf
          - CormorantGaramond.ttf
          - CormorantGaramond-Italic.ttf
          - ManufacturingConsent-Regular.ttf
          - Righteous-Regular.ttf
          - DMSans.ttf
          - BigShouldersDisplay-Black.ttf
          - BigShouldersDisplay-ExtraBold.ttf
          - Figtree-ExtraBold.ttf
          # Its PostScript name is PlayfairDisplay-Regular, though the face is the Bold.
          - PlayfairDisplay-Bold.ttf
          - Jura-Variable.ttf
          - Oxanium-Variable.ttf
          # Cyberpunk's: the face closest to Cyberpunk 2077's interface (as IdleHoursTV's).
          - Rajdhani-Medium.ttf
          - Rajdhani-SemiBold.ttf
          - Rajdhani-Bold.ttf
          # Uplink's: Deus Ex's wide face and the Codex's Saira (through its width axis), as
          # IdleHoursTV's.
          - Michroma-Regular.ttf
          - Saira-Variable.ttf
          # Grimoire's: Hermann S Designs' Warcraft-inspired display serif (its own licence,
          # beside it: free to use and share, not to modify or sell).
          - Goodmountain-Regular.otf
        # The Pi is found over Bonjour and read over plain HTTP on the LAN.
        NSLocalNetworkUsageDescription: Home Dashboard finds your dashboard's Raspberry Pi on your network and reads its calendar and weather from it.
        NSBonjourServices:
          - _homedash._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).homedashboard
        PRODUCT_NAME: Home Dashboard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Home Dashboard
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        # Rendered by scripts/generate_brand_assets.py.
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
  # Drives the app with the Siri Remote (XCUIRemote): focus is the one thing the simulator
  # tools cannot exercise, and a panel the remote cannot reach is a dead app on a TV.
  HomeDashboardUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: HomeDashboardUITests
    dependencies:
      - target: HomeDashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).homedashboard.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        TEST_TARGET_NAME: HomeDashboard
  # The Mac screensaver: the layouts, the store and the Pi browser compiled for macOS, with
  # its own screen and options in HomeDashboardSaver/. The bundle's principal class is
  # HomeDashboardSaverView. The TV's own screen (the remote, the settings drawer) stays out.
  # Tools/install_saver.sh puts it in ~/Library/Screen Savers.
  HomeDashboardSaver:
    type: bundle
    platform: macOS
    sources:
      - path: HomeDashboardTV/UI
        excludes:
          - "DashboardScreen.swift"
          - "SettingsView.swift"
      - path: HomeDashboardTV/App
        excludes:
          - "HomeDashboardApp.swift"
      - path: HomeDashboardTV/Resources
        excludes:
          - "Fonts/*.txt"
      - path: HomeDashboardSaver
        excludes:
          - "Host"
          - "Info.plist"
    dependencies:
      - package: DashboardCore
      - sdk: ScreenSaver.framework
    info:
      path: HomeDashboardSaver/Info.plist
      properties:
        NSPrincipalClass: HomeDashboardSaverView
        NSHumanReadableCopyright: ""
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).homedashboard.saver
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_NAME: Home Dashboard
        WRAPPER_EXTENSION: saver
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_VERSION: "5.0"
        # The asset catalog's tvOS brand assets mean nothing here; only the moon photo is used.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  # A window around the saver's screen, for working on the port without locking the Mac.
  HomeDashboardSaverHost:
    type: application
    platform: macOS
    sources:
      - path: HomeDashboardTV/UI
        excludes:
          - "DashboardScreen.swift"
          - "SettingsView.swift"
      - path: HomeDashboardTV/App
        excludes:
          - "HomeDashboardApp.swift"
      - path: HomeDashboardTV/Resources
        excludes:
          - "Fonts/*.txt"
      - path: HomeDashboardSaver
        excludes:
          - "Bundle"
          - "Info.plist"
          - "Host/Info.plist"
    dependencies:
      - package: DashboardCore
    info:
      path: HomeDashboardSaver/Host/Info.plist
      properties:
        NSHumanReadableCopyright: ""
        NSLocalNetworkUsageDescription: The host finds your dashboard's Raspberry Pi on your network and reads its calendar and weather from it.
        NSBonjourServices:
          - _homedash._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).homedashboard.saverhost
        PRODUCT_NAME: HomeDashboardSaverHost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Home Dashboard Saver Host
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
schemes:
  HomeDashboard:
    build:
      targets:
        HomeDashboard: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HomeDashboardUITests
  HomeDashboardSaver:
    build:
      targets:
        HomeDashboardSaver: all
    run:
      config: Debug
    archive:
      config: Release
  HomeDashboardSaverHost:
    build:
      targets:
        HomeDashboardSaverHost: all
    run:
      config: Debug
