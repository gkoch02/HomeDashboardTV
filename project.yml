name: HomeDashboardTV
options:
  bundleIdPrefix: dev.plumpbug
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: "27.0"
settings:
  base:
    # Signing matches the other PlumpBug apps: one team, automatic profiles.
    DEVELOPMENT_TEAM: FGG98L437R
    CODE_SIGN_STYLE: Automatic
    # Xcode 27's recommended settings live here, not in the .pbxproj, because an edit
    # made in Xcode's UI is wiped by the next `xcodegen`.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
packages:
  DashboardCore:
    path: Packages/DashboardCore
targets:
  HomeDashboard:
    type: application
    platform: tvOS
    productName: Home Dashboard
    sources:
      - path: HomeDashboardTV
        excludes:
          - "Info.plist"
    dependencies:
      - package: DashboardCore
    # Generated by XcodeGen and committed, like the project, so a fresh clone builds.
    info:
      path: HomeDashboardTV/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: LaunchBackground
        # The Pi is found over Bonjour and read over plain HTTP on the LAN.
        NSLocalNetworkUsageDescription: Home Dashboard finds your dashboard's Raspberry Pi on your network and reads its calendar and weather from it.
        NSBonjourServices:
          - _homedash._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.plumpbug.homedashboard
        PRODUCT_NAME: Home Dashboard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Home Dashboard
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        # Rendered by scripts/generate_brand_assets.py.
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
schemes:
  HomeDashboard:
    build:
      targets:
        HomeDashboard: all
    run:
      config: Debug
    test:
      config: Debug
